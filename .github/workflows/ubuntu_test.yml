name: Ubuntu Test

on:
  workflow_dispatch:

jobs:
  ubuntu-run:
    name: Ubuntu Test
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      # Preliminary
      - name: Connect to runner
        run: echo "Connected to self-hosted runner as $USER"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: abaer1902
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # Docker setup
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          call: check

      # Build runtime application image
      - name: Build runtime image
        run: |
          docker build \
            --target runtime \
            -t abaer1902/avalonia-app:test \
            .

      # Smoke test runtime image
      - name: Smoke test container
        shell: bash
        run: |
          set +e

          docker run --rm \
            --entrypoint /bin/bash \
            abaer1902/avalonia-app:test \
            -c 'timeout --foreground -k 2s 10s xvfb-run -a dotnet AvaloniaApplication1.dll'

          exit_code=$?

          echo "Smoke test exit code: $exit_code"

          case "$exit_code" in
            124)
              echo "PASS: application remained running for at least 10 seconds."
              exit 0
              ;;

            0)
              echo "FAIL: application exited normally before 10 seconds."
              exit 1
              ;;

            *)
              echo "FAIL: application crashed or exited with code $exit_code."
              exit 1
              ;;
          esac

      # Save failed runtime image
      - name: Save Docker image if job failed
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p artifacts

          if docker image inspect abaer1902/avalonia-app:test >/dev/null 2>&1; then
            echo "Docker image exists. Saving image artifact."

            docker save \
              -o artifacts/avalonia-app-test.tar \
              abaer1902/avalonia-app:test
          else
            echo "Image does not exist; skipping."
          fi

      - name: Upload failed Docker image
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-app-ubuntu-run-${{ github.run_number }}
          path: artifacts/avalonia-app-test.tar
          if-no-files-found: ignore
          retention-days: 7

      # Push exact runtime image that passed
      - name: Push validated runtime image
        if: ${{ success() }}
        shell: bash
        run: |
          docker tag \
            abaer1902/avalonia-app:test \
            abaer1902/avalonia-app:latest

          docker push \
            abaer1902/avalonia-app:latest

      # Build reusable SDK test-runner image
      - name: Build test runner image
        if: ${{ success() }}
        shell: bash
        run: |
          docker build \
            --target test \
            -t abaer1902/avalonia-test-runner:latest \
            .

      # Push reusable SDK test-runner image that passed
      - name: Push test runner image
        if: ${{ success() }}
        shell: bash
        run: |
          docker push \
            abaer1902/avalonia-test-runner:latest