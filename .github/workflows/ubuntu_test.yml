name: Ubuntu Test
on:
 workflow_dispatch:

jobs:
  ubuntu-run:
    name: Ubuntu Test
    runs-on: self-hosted

    steps:
      # Preliminary
      - name: Connect to runner
        run: echo "Connected to self-hosted runner as $USER"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "abaer1902"
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}



      # Set up Docker, QEMU, and Buildx
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
          
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate build configuration
        uses: docker/build-push-action@v7
        with:
          call: check

      - name: Load Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: abaer1902/avalonia-app:test


      # Testing the application in a container (10 second timeout)
      - name: Smoke test container
        run: |
          container_id=$(docker run -d \
            --entrypoint /usr/bin/xvfb-run \
            abaer1902/avalonia-app:test \
            -a dotnet AvaloniaApplication1.dll)
          echo "Started container: $container_id"
          sleep 10

          if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" = "true" ]; then
            echo "Smoke test passed: application ran for >10 seconds."
            docker rm -f "$container_id"
          else
            exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$container_id")

            echo "Smoke test failed. Container exited with code $exit_code."
            echo "Container logs:"
            docker logs "$container_id"

            docker rm "$container_id"
            exit "$exit_code"
          fi

      - name: Build and push valid image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: abaer1902/avalonia-app:latest

