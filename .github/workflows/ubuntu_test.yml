name: Ubuntu Test
on:
 workflow_dispatch:

jobs:
  ubuntu-run:
    name: Ubuntu Test
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      # Preliminary
      - name: Connect to runner
        run: echo "Connected to self-hosted runner as $USER"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "abaer1902"
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}



      # Set up Docker, QEMU, and Buildx
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
          
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate build configuration
        uses: docker/build-push-action@v7
        with:
          call: check

      - name: Load Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: abaer1902/avalonia-app:test

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            -t abaer1902/avalonia-app:test \
            .

      # Testing the application in a container (10 second timeout)
      - name: Smoke test container
        run: |
          container_id=$(docker run -d \
            --entrypoint /usr/bin/xvfb-run \
            abaer1902/avalonia-app:test \
            -a dotnet AvaloniaApplication1.dll)
          echo "Started container: $container_id"
          sleep 10

          echo "=== Container processes ==="
          docker top "$container_id"

          echo "=== Container logs ==="
          docker logs "$container_id"

          # First verify the container itself is alive
          if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" != "true" ]; then
            echo "FAIL: Container terminated."
            docker rm "$container_id" || true
            exit 1
          fi

          # Then verify the actual .NET application is alive
          if ! docker top "$container_id" -eo args | grep -q '[d]otnet AvaloniaApplication1.dll'; then
            echo "FAIL: Container is running, but the Avalonia application is not."
            docker rm -f "$container_id"
            exit 1
          fi

          echo "PASS: Avalonia application remained running for 10 seconds."

          docker rm -f "$container_id"

      - name: Save Docker image if job failed
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p artifacts

          if docker image inspect abaer1902/avalonia-app:test >/dev/null 2>&1; then
            echo "Docker image exists. Saving image artifact."

            docker save \
              -o artifacts/avalonia-app-test.tar \
              abaer1902/avalonia-app:test
          else
            echo "Image does not exist; skipping."
          fi

      - name: Upload failed Docker image
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-app-ubuntu-run-${{ github.run_number }}
          path: artifacts/avalonia-app-test.tar
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and push valid image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: abaer1902/avalonia-app:latest

# pass