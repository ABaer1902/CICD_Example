name: Ubuntu Test

on:
  workflow_dispatch:

jobs:
  ubuntu-run:
    name: Ubuntu Test
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      # Preliminary
      - name: Connect to runner
        run: echo "Connected to self-hosted runner as $USER"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: abaer1902
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # Docker setup
      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          call: check

      # Create runtime application image
      - name: Build runtime image
        run: |
          docker build \
            --target runtime \
            -t abaer1902/avalonia-runtime:latest \
            .

      # Smoke test runtime image
      - name: Smoke test container
        shell: bash
        run: |
          set +e

          docker run --rm \
            --entrypoint /bin/bash \
            abaer1902/avalonia-runtime:latest \
            -c 'timeout --foreground -k 2s 10s xvfb-run -a dotnet AvaloniaApplication1.dll'

          exit_code=$?

          echo "Smoke test exit code: $exit_code"

          case "$exit_code" in
            124)
              echo "PASS: application remained running for at least 10 seconds."
              exit 0
              ;;

            0)
              echo "FAIL: application exited normally before 10 seconds."
              exit 1
              ;;

            *)
              echo "FAIL: application crashed or exited with code $exit_code."
              exit 1
              ;;
          esac

      # Save failed runtime image
      - name: Save Docker image if job failed
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p artifacts

          if docker image inspect abaer1902/avalonia-runtime:latest >/dev/null 2>&1; then
            echo "Docker image exists. Saving image artifact."

            docker save \
              -o artifacts/avalonia-app-test.tar \
              abaer1902/avalonia-runtime:latest
          else
            echo "Image does not exist; skipping."
          fi

      - name: Upload failed Docker image
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-app-ubuntu-run-${{ github.sha }}
          path: artifacts/avalonia-app-test.tar
          if-no-files-found: ignore
          retention-days: 7

      # Push exact runtime image that passed
      - name: Push validated runtime image
        if: ${{ success() }}
        shell: bash
        run: |
          docker tag \
            abaer1902/avalonia-runtime:latest \
            abaer1902/avalonia-app:latest

          docker push \
            abaer1902/avalonia-app:latest



      # Cleanup
      - name: Clean temporary Docker resources
        if: ${{ always() }}
        run: |
          docker image rm abaer1902/avalonia-runtime:latest || true
          docker image rm abaer1902/avalonia-build:latest || true
      



      - name: Check workspace ownership
        if: ${{ always() }}
        shell: bash
        run: |
          echo "Runner identity:"
          id

          echo "Generated .NET directories:"
          find "$GITHUB_WORKSPACE" \
            \( -path "*/bin" -o -path "*/bin/Release" -o -path "*/obj" \) \
            -exec ls -ld {} \; 2>/dev/null || true