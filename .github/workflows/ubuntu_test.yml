name: Ubuntu Test
on:
 workflow_dispatch:

jobs:
  ubuntu-run:
    name: Ubuntu Test
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      # Preliminary
      - name: Connect to runner
        run: echo "Connected to self-hosted runner as $USER"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "abaer1902"
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}



      # Set up Docker, QEMU, and Buildx
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
          
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate build configuration
        uses: docker/build-push-action@v7
        with:
          call: check

      - name: Load Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: abaer1902/avalonia-app:test


      # Unit tests
      - name: Run unit tests
        run: |
          dotnet test \
            tests/AvaloniaApplication1.UnitTests/AvaloniaApplication1.UnitTests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory TestResults/Unit

      # Avalonia headless UI tests
      - name: Run UI tests
        run: |
          dotnet test \
            tests/AvaloniaApplication1.HeadlessTests/AvaloniaApplication1.HeadlessTests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=ui-tests.trx" \
            --results-directory TestResults/UI

      # Testing the application in a container (10 second timeout)
      - name: Smoke test container
        shell: bash
        run: |
          set +e

          docker run --rm \
            --entrypoint /bin/bash \
            abaer1902/avalonia-app:test \
            -c 'timeout --foreground -k 2s 10s xvfb-run -a dotnet AvaloniaApplication1.dll'

          exit_code=$?

          echo "Smoke test exit code: $exit_code"

          case "$exit_code" in
            124)
              echo "PASS: application remained running for at least 10 seconds."
              exit 0
              ;;

            0)
              echo "FAIL: application exited normally before 10 seconds."
              exit 1
              ;;

            *)
              echo "FAIL: application crashed or exited with code $exit_code."
              exit 1
              ;;
          esac

      - name: Save Docker image if job failed
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p artifacts

          if docker image inspect abaer1902/avalonia-app:test >/dev/null 2>&1; then
            echo "Docker image exists. Saving image artifact."

            docker save \
              -o artifacts/avalonia-app-test.tar \
              abaer1902/avalonia-app:test
          else
            echo "Image does not exist; skipping."
          fi

      - name: Upload failed Docker image
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-app-ubuntu-run-${{ github.run_number }}
          path: artifacts/avalonia-app-test.tar
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and push valid image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: abaer1902/avalonia-app:latest

# pass