name: Ubuntu Run
on:
 workflow_dispatch:

jobs:
  ubuntu-run:
    name: Ubuntu Run
    runs-on: self-hosted

    steps:
      # Preliminary
      - name: Connect to runner
        run: echo "Connected to self-hosted runner as $USER"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "abaer1902"
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}



      # Set up Docker, QEMU, and Buildx
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
          
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate build configuration
        uses: docker/build-push-action@v7
        with:
          call: check

      - name: Load Docker image
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: abaer1902/avalonia-app:test



      # Testing the application in a container (10 second timeout)
      - name: Smoke test container
        run: |
          timeout 10s docker run \
            --rm \
            --entrypoint /usr/bin/xvfb-run \
            abaer1902/avalonia-app:test \
            -a dotnet AvaloniaApplication1.dll || code=$?

          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then
            exit "${code}"
          fi

      - name: Build and push valid image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: abaer1902/avalonia-app:latest

# pass