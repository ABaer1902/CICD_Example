name: Publish Build Image

on:
  workflow_dispatch:

jobs:
  publish-build:
    name: Publish a valid build image for testing
    runs-on:
      - self-hosted
      - linux


    steps:
      # Preliminary
      - name: Connect to runner
        run: echo "Connected to self-hosted runner as $USER"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: abaer1902
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # Docker setup
      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          call: check

      # Create build image and push to Docker Hub
      - name: Build testing image
        run: |
          docker build \
            --target build \
            -t abaer1902/avalonia-build:latest \
            .

      - name: Publish build image
        if: ${{ success() }}
        run: |
          docker push abaer1902/avalonia-build:latest


      # Cleanup
      - name: Clean build resources
        if: ${{ always() }}
        shell: bash
        run: |
          echo "=== Docker usage before cleanup ==="
          docker system df || true

          # Clean docker resources after upload
          docker image rm -f abaer1902/avalonia-build:latest 2>/dev/null || true
          docker container prune -f || true
          docker image prune -f || true
          docker builder prune -f || true

          echo "=== Docker usage after cleanup ==="
          docker system df || true

