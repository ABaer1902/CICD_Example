name: Docker Unit Tests

on:
  workflow_dispatch:

jobs:
  dockerUnitTests:
    name: Run Unit Tests on latest docker image
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      - name: Connect to runner
        run: echo "Connected to self-hosted runner as $USER"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: abaer1902
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Pull runner image
        run: |
          docker pull abaer1902/avalonia-build:latest

      - name: Run unit tests in Docker
        run: |
          mkdir -p "$PWD/.container-home"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/workspace/.container-home \
            -e DOTNET_CLI_HOME=/workspace/.container-home \
            -e DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1 \
            -v "$PWD:/workspace" \
            -w /workspace \
            abaer1902/avalonia-build:latest \
            dotnet test Tests/UnitTests/UnitTests.csproj \
              --configuration Release \
              --logger "trx;LogFileName=unit-tests.trx" \
              --results-directory TestResults/Unit

      - name: Upload unit test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_number }}
          path: TestResults/Unit
          if-no-files-found: ignore
          retention-days: 7



      # Cleanup
      - name: Clean unit test resources
        if: ${{ always() }}
        shell: bash
        run: |
          echo "=== Docker usage before cleanup ==="
          docker system df || true

          # Clean docker resources after upload
          docker image rm -f abaer1902/avalonia-build:latest 2>/dev/null || true
          docker container prune -f || true
          docker image prune -f || true
          docker builder prune -f || true

          # Remove temporary directory for .NET
          rm -rf "$PWD/.container-home"

          # Remove artifact locally after it is uploaded
          rm -rf "$PWD/TestResults"


          echo "=== Docker usage after cleanup ==="
          docker system df || true