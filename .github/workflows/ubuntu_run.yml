name: Ubuntu Run

on:
 workflow_dispatch:

Jobs:
  ubuntu-run:
    name: Ubuntu Run
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Check Docker
          shell: pwsh
          run: |
            if (Get-Command docker -ErrorAction SilentlyContinue) {
                Write-Host "Docker is installed."
                docker --version
            }
            else {
                Write-Error "Docker is not installed on this runner."
                exit 1
            }

        - name: Verify Docker daemon
        shell: pwsh 
        run: |
          docker info

        - name: Build Ubuntu builder image
        shell: pwsh 
        run: |
          docker build -t avalonia-builder -f Dockerfile.build .

        - name: Build Avalonia app in Ubuntu
        shell: pwsh 
        run: |
          docker run --rm `
            -v "${{ github.workspace }}:/src" `
            -w /src `
            avalonia-builder `
            bash -c "dotnet restore && dotnet build -c Release"